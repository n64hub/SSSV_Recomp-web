name: Linux and macOS releases
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }} Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux
            arch: x64
          - runner: macos-15
            platform: macOS
            arch: arm64
          - runner: macos-15-intel
            platform: macOS
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified generated C source (no ROM)
        run: python tools/ci_release.py prepare
      - name: Apply every runtime and renderer modification
        run: python tools/apply_dependency_patches.py
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libgtk-3-dev lld llvm clang libx11-dev libxrandr-dev libfreetype-dev libvulkan-dev
          echo "PATCH_CC=$(command -v clang)" >> "$GITHUB_ENV"
          echo "PATCH_LD=$(command -v ld.lld)" >> "$GITHUB_ENV"
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja sdl2 freetype llvm pkgconf
          python -m pip install macholib
          echo "PATCH_CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "PATCH_LD=$(brew --prefix llvm)/bin/ld.lld" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix sdl2):$(brew --prefix freetype)" >> "$GITHUB_ENV"
          chmod +x .github/macos/ld64
      - name: Check out pinned recompiler tools
        uses: actions/checkout@v4
        with:
          repository: N64Recomp/N64Recomp
          ref: 81213c1831fab2521a6a5459c67b63437d67e253
          path: N64RecompSource
          submodules: recursive
          persist-credentials: false
      - name: Build patch recompiler (no ROM input)
        run: |
          cmake -S N64RecompSource -B build-tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tools --target N64RecompCLI --parallel 3
          if [ -f build-tools/N64Recomp ]; then
            cp build-tools/N64Recomp ./N64Recomp
          else
            cp build-tools/N64RecompCLI ./N64Recomp
          fi
      - name: Configure Release
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0)
            if [ "${{ matrix.arch }}" = arm64 ]; then
              args+=(-DCMAKE_OSX_ARCHITECTURES=arm64)
            else
              args+=(-DCMAKE_OSX_ARCHITECTURES=x86_64)
            fi
          fi
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DPATCHES_C_COMPILER="$PATCH_CC" -DPATCHES_LD="$PATCH_LD" "${args[@]}"
      - name: Compile our game and patches
        run: cmake --build build-release --target SSSVRecompiled --parallel 3
      - name: Package assets and licenses; reject ROMs and saves
        run: python tools/ci_release.py package --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - name: Upload audited release package
        uses: actions/upload-artifact@v4
        with:
          name: SSSVRecompiled-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
