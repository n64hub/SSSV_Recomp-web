text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80129290

# ============================================================================
# Gameplay Fixes
# ============================================================================

# A transition can reset the outstanding-frame counter while completion
# messages from the asynchronous renderer are still queued. Do not let a late
# completion wrap zero to 65535: thread6 would then stop submitting frames.
# Clamp the loaded count before the original decrement, including both paths
# through the frame-completion case.
[[patches.hook]]
func = "thread6_loop"
before_vram = 0x8012A1FC
text = "if (ctx->r12 == 0) { ctx->r12 = 1; }"

# Treat the boot sequence as already watched after EEPROM initialization, even
# when a missing save has just created fresh defaults. Keep all other flags and
# player banks intact, and persist the change with the game's checksum writer.
[[patches.hook]]
func = "func_80130E44"
before_vram = 0x80131048
text = """
if (MEM_W(0, S32(0x8023F2A8)) & 1) {
    MEM_W(0, S32(0x8023F2A8)) &= ~1;
    recomp_context saved = *ctx;
    ctx->r4 = 4;
    write_eeprom(rdram, ctx);
    *ctx = saved;
}
"""

